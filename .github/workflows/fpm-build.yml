name: fpm-build

on: [push, pull_request]

jobs:
  fpm-build:
    name: Run tests the fpm branches
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        toolchain: [{compiler: gcc, version: '13' }]
        fpm_versions: [v0.12.0, current]
        maxrank: [4]
        include:
          - os: ubuntu-latest
            toolchain: {compiler: gcc, version: '13' }
            fpm_versions: v0.12.0
            maxrank: 2
          - os: windows-latest
            toolchain: {compiler: gcc, version: '13' }
            fpm_versions: v0.12.0
            maxrank: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v2.3.1

      - name: Set up Python 3.x
        uses: actions/setup-python@v1
        with:
          python-version: 3.x

      - name: Install requirements
        run: pip install --upgrade -r config/requirements.txt

      - uses: fortran-lang/setup-fortran@main
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Setup Fortran Package Manager
        uses: fortran-lang/setup-fpm@v9
        with:
          fpm-version: ${{ matrix.fpm_versions }}

      - if: runner.os != 'Windows'
        run: | # Use fpm gnu ci to check xdp and qp
          python config/fypp_deployment.py --maxrank ${{ matrix.maxrank }} --with_xdp --with_qp
          fpm build --profile release --flag '-DWITH_XDP -DWITH_QP'

      - name: Build rank-2 examples on Windows
        if: runner.os == 'Windows'
        env:
          FPM_FC: gfortran
          FPM_CC: gcc
          FPM_CXX: g++
        run: python config/fypp_deployment.py --maxrank 2 --build

      - name: Run tests
        # Some existing tests unconditionally use rank-3 arrays.
        if: matrix.maxrank == 4
        run: fpm test --profile release --flag '-DWITH_XDP -DWITH_QP'
