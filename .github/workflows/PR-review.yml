name: PR-Review
on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'STYLE_GUIDE.md'
      - 'WORKFLOW.md'
      - '.github/workflows/sphinx-doc-preview.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  misspell:
    if: ${{ github.ref_name != 'copilot/modernize-docs-with-sphinx' && github.head_ref != 'copilot/modernize-docs-with-sphinx' }}
    name: review-dog / misspell
    runs-on: ubuntu-latest
    steps:
      - name: Check out code.
        uses: actions/checkout@v2
      - name: misspell
        uses: reviewdog/action-misspell@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          locale: "US"
          reporter: github-pr-review
          level: warning
          ignore: colour
